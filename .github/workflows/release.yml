name: release

# Triggered by a v* tag (tests + GitHub release) or manual dispatch (tests only, no release).
# This repository is a headless application, not a publishable npm library: releases are GitHub releases with the
# generated notes and the source archives GitHub attaches automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:host
      - run: npm run lint

      - name: Check the tag against package.json and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ "${CURRENT}" != "${VERSION}" ]]; then
            echo "package.json version ${CURRENT} does not match tag ${VERSION}" >&2
            exit 1
          fi
          if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi

  plugin:
    name: astrbot plugin (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install aiohttp
      - run: python -m unittest discover -s astrbot_plugin_ournotes_script/tests -v

  release:
    name: github release
    needs: [test, plugin]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Use reviewed release notes when available
        run: |
          reviewed="release-notes/${GITHUB_REF_NAME}.txt"
          if [ -f "$reviewed" ]; then
            cp "$reviewed" RELEASE_NOTES.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
