name: ci

# The same checks the release workflow runs, so a green pull request predicts a green release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The host is an npm workspace (package.json "workspaces": ["host"]), so one install covers the engine, js-yaml
      # and ffmpeg-static.
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:host
      - run: npm run lint
